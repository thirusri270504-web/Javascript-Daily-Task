<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booksky</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Navbar */

        .navbar {
            background-color: black;
            color: white;
            padding: 20px;
        }

        .navbar h1 {
            margin: 0;
        }

        /* Book container */

        .book-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }

        /* Book card */

        .book-card {
            width: 250px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px gray;
        }

        .book-card h2 {
            margin-top: 0;
        }

        .book-card h4 {
            color: #555;
        }

        .book-card p {
            line-height: 1.5;
        }

        /* Delete button */

        .delete-button {
            background-color: red;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Add button */

        .add-button {
            position: fixed;
            right: 30px;
            bottom: 30px;

            width: 60px;
            height: 60px;

            border-radius: 50%;
            border: none;

            background-color: black;
            color: white;

            font-size: 30px;
            cursor: pointer;
        }

        /* Popup */

        .popup-background {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.6);

            justify-content: center;
            align-items: center;
        }

        /* Popup box */

        .popup-box {
            background-color: white;

            width: 350px;

            padding: 25px;

            border-radius: 10px;
        }

        .popup-box h2 {
            margin-top: 0;
        }

        .popup-box input,
        .popup-box textarea {

            width: 100%;

            padding: 10px;

            margin-bottom: 15px;

            box-sizing: border-box;
        }

        .popup-box textarea {
            height: 100px;
        }

        .add-book-button {
            background-color: black;
            color: white;

            border: none;

            padding: 10px 20px;

            cursor: pointer;
        }

        .close-button {
            background-color: gray;
            color: white;

            border: none;

            padding: 10px 20px;

            cursor: pointer;
        }

    </style>

</head>


<body>

    <!-- Navbar -->

    <div class="navbar">

        <h1>Booksky</h1>

    </div>


    <!-- Books will appear here -->

    <div class="book-container" id="bookContainer">

        <!-- JavaScript will add books here -->

    </div>


    <!-- Add button -->

    <button class="add-button" id="addButton">
        +
    </button>


    <!-- Popup -->

    <div class="popup-background" id="popupBackground">

        <div class="popup-box">

            <h2>Add Book</h2>

            <input
                type="text"
                id="bookTitle"
                placeholder="Book Title"
            >

            <input
                type="text"
                id="bookAuthor"
                placeholder="Book Author"
            >

            <textarea
                id="bookDescription"
                placeholder="Book Description"
            ></textarea>


            <button
                class="add-book-button"
                id="addBookButton"
            >
                Add Book
            </button>


            <button
                class="close-button"
                id="closeButton"
            >
                Close
            </button>

        </div>

    </div>


    <!-- JavaScript file -->

    <script src="script.js"></script>

</body>

</html>
