
<html>

<head>

    <title>Fibonacci series</title>
</head>

<body>

    <h1>fibonacci series</h1>

   

    <script>
		function series(){
       s=6;
       a=0;
       b=1;
       document.write(a + " " + b);
       for(i=0;i<s-2;i++){
       
        c=a+b;
        document.write(c);
        a=b;
        b=c;


       }
        }
        series();
		
		
				
    </script>

</body>

</html>
