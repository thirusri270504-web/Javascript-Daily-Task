
<html>

<head>

    <title>vowel count </title>
</head>

<body>

    <h1>vowel  count using method </h1>

   

    <script>
		function count(){
		let  a="thiru"
		let count=0;
		let vowel="aeiouAEIOU";
		for(let i=0;i<a.length;i++){
		if(vowel.includes(a[i])){
		count++;
		}
		}
		document.write("vowel count :" + count);
		}
		count();
		
		
				
    </script>

</body>

</html>
