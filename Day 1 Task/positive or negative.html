<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positive or Negative</title>
</head>

<body>

    <h1>Positive or Negative</h1>

    <p id="result"></p>

    <script>
        let number = -10;

        if (number > 0) {
            document.getElementById("result").textContent = "Positive";
        } 
        else if (number < 0) {
            document.getElementById("result").textContent = "Negative";
        } 
        else {
            document.getElementById("result").textContent = "Zero";
        }
    </script>

</body>

</html>
