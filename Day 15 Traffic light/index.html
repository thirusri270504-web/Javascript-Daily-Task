<html>
    <center>
    <head>
        <title>Traffic light</title>
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
    
    <br><br>
    <body>
        <h2 class="font-sans text-2xl py-5 font-bold"> Traffic light </h2>
        <div class="border border-black bg-black rounded-2xl text-white w-32 h-10  px-5 py-45"> 
        <button  onclick="red()" id="one"
         class="border border-red-500 bg-red-500 px-5 py-5 -mt-30  text-white rounded-4xl">Red</button>
        <button onclick="yellow()" id="one"
         class="border border-yellow-500 bg-yellow-500 px-3 -mt-12 py-5 text-white rounded-4xl">yellow</button>
        <button onclick="green()" id="one"
         class="border border-green-500 bg-green-500 px-3 mt-2 py-5 text-white rounded-4xl">Green</button>
        </div>
    <script src="script.js"></script>
    </body>
    </center>
</html>
