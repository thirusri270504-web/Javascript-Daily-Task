
<html>

<head>

    <title>Print 100 to 1 number  </title>
</head>

<body>

    <h1>Print 100 to 1 number</h1>

   

    <script>
		function number(){
		
		for(let i=100;i>=1;i--){
		document.write(i + "<br/>"); 
		}
		}
		
		number();
		
		
				
    </script>

</body>

</html>
