
<html>

<head>

    <title>Print 1 to 100 number  </title>
</head>

<body>

    <h1>Print 1 to 100 number</h1>

   

    <script>
		function number(){
		
		for(let i=1;i<=100;i++){
		document.write(i + "<br/>"); 
		}
		}
		
		number();
		
		
				
    </script>

</body>

</html>
