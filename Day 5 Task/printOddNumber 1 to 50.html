
<html>

<head>

    <title>Print Odd number 1 to 50 </title>
</head>

<body>

    <h1>Print Odd number 1 to 50</h1>

   

    <script>
		function number(){
		
		for(let i=1;i<=100;i+=2){
		document.write(i + "<br/>"); 
		}
		}
		
		number();
		
		
				
    </script>

</body>

</html>
