
<html>

<head>

    <title>Print even number 0 to 50   </title>
</head>

<body>

    <h1>Print even number 0 to 50</h1>

   

    <script>
		function number(){
		
		for(let i=0;i<=50;i+=2){
            
		document.write(i + "<br/>"); 
		}
		}
		
		number();
		
		
				
    </script>

</body>

</html>
