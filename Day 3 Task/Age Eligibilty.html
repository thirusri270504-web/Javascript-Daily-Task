<body>
    <h1>Voter eligibility</h1>
    <script>
		function Age(){
		let age=70;
		if(age>0 && age<18){
		console.log("your not eligible to vote");
		}
		else if(age>=18 && age<60){
		console.log("Eligible vote");
		}
		else if(age>=60 && age<120){
		console.log("Senior citizen");
		}
		else{
		console.log("Invalid age");
		}
		}
		Age();
	 </script>
