		<title>Voter eligibility</title>
</head>
<body>
    <h1>Voter eligibility</h1>
    <script>
		function Age(){
		let age=70;
		if(age>0 && age<18){
		document.write("your not eligible to vote");
		}
		else if(age>=18 && age<60){
		document.write("Eligible vote");
		}
		else if(age>=60 && age<120){
		document.write("Senior citizen");
		}
		else{
		document.write("Invalid age");
		}
		}
		Age();
	 </script>
</body>
