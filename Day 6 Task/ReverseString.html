
<html>

<head>

    <title>Reverse String </title>
</head>

<body>

    <h1>Reverse String </h1>

   

    <script>
		function reverse(){
            let str="hello";
            let res=" ";
            for(i=str.length-1;i>=0;i--){
                res +=str[i];

            }
            document.write(res);
        }
        reverse();
		
		
				
    </script>

</body>

</html>
